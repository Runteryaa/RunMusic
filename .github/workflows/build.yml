name: Build Android APK & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 🏗 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ☕ Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 💾 Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 💾 Cache Android NDK
        uses: actions/cache@v4
        id: cache-ndk
        with:
          path: /usr/local/lib/android/sdk/ndk
          key: android-ndk-v27-${{ runner.os }}

      - name: 🛠 Ensure Android NDK Side-by-Side (27.0 & 27.1)
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          for ndk_ver in "27.0.12077973" "27.1.12297006"; do
            NDK_PATH="$SDK_DIR/ndk/$ndk_ver"
            if [ -d "$NDK_PATH" ] && [ -f "$NDK_PATH/source.properties" ]; then
              echo "✅ Android NDK $ndk_ver is already present."
            else
              echo "⚡ Installing Android NDK $ndk_ver with retries..."
              SUCCESS=0
              for attempt in {1..5}; do
                echo "Attempt $attempt / 5 for NDK $ndk_ver..."
                if echo "y" | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --install "ndk;$ndk_ver"; then
                  if [ -d "$NDK_PATH" ] && [ -f "$NDK_PATH/source.properties" ]; then
                    SUCCESS=1
                    echo "✅ Successfully installed Android NDK $ndk_ver."
                    break
                  fi
                fi
                echo "⚠️ Attempt $attempt failed. Waiting 10s before retry..."
                sleep 10
              done
              if [ "$SUCCESS" -ne 1 ]; then
                echo "❌ Failed to install Android NDK $ndk_ver after 5 attempts."
                exit 1
              fi
            fi
          done
          echo "Side-by-side NDK directory contents:"
          ls -la "$SDK_DIR/ndk"

      - name: 📦 Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 🚀 Publish EAS Update (OTA)
        run: |
          TARGET_BRANCH="${GITHUB_REF_NAME}"
          if [ "$TARGET_BRANCH" = "beta" ]; then
            UPDATE_BRANCH="beta"
          else
            UPDATE_BRANCH="production"
          fi
          echo "Publishing EAS Update for branch: $UPDATE_BRANCH"
          npx eas-cli update --branch $UPDATE_BRANCH --platform android --environment production --non-interactive -m "Automated OTA update from CI ($UPDATE_BRANCH)"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_SKIP_AUTO_FINGERPRINT: 1

      - name: 🔢 Set Android versionCode from CI run
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          node -e "const fs=require('fs');const p='app.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.expo.android.versionCode=Number(process.env.ANDROID_VERSION_CODE);fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');"
          grep -A1 '"versionCode"' app.json

      - name: 🛠 Prebuild Android
        run: |
          node ./scripts/patch-ble-plx.js
          npx expo prebuild --platform android

      - name: 🔧 Configure Build (Disable New Arch & Build ARMv7 + ARM64)
        run: |
          sed -i 's/newArchEnabled=true/newArchEnabled=false/' android/gradle.properties
          grep -q 'newArchEnabled' android/gradle.properties || echo 'newArchEnabled=false' >> android/gradle.properties

          sed -i 's/reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a,armeabi-v7a/' android/gradle.properties
          grep -q 'reactNativeArchitectures' android/gradle.properties || echo 'reactNativeArchitectures=arm64-v8a,armeabi-v7a' >> android/gradle.properties

          # Remove any ndk.dir from local.properties so AGP can use side-by-side NDKs
          sed -i '/ndk\.dir/d' android/local.properties 2>/dev/null || true

          TARGET_BRANCH="${GITHUB_REF_NAME}"
          if [ "$TARGET_BRANCH" = "beta" ]; then
            UPDATE_CHANNEL="beta"
          else
            UPDATE_CHANNEL="production"
          fi
          echo "Setting EXPO_UPDATES_CHANNEL to $UPDATE_CHANNEL"
          sed -i "s|</application>|    <meta-data android:name=\"expo.modules.updates.EXPO_UPDATES_CHANNEL\" android:value=\"$UPDATE_CHANNEL\"/>\n  </application>|" android/app/src/main/AndroidManifest.xml

          echo "--- Configured gradle.properties, local.properties & AndroidManifest.xml ---"
          grep -E '(newArch|reactNativeArchitectures)' android/gradle.properties
          cat android/local.properties || true
          grep -i 'EXPO_UPDATES_CHANNEL' android/app/src/main/AndroidManifest.xml || true

      - name: 🏗 Build APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --build-cache --parallel -PreactNativeArchitectures=arm64-v8a,armeabi-v7a -x lintVitalRelease

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RunMusic.apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: 🏷 Create Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name == 'beta' && format('v1.0.{0}-beta', github.run_number) || format('v1.0.{0}', github.run_number) }}
          name: ${{ github.ref_name == 'beta' && format('RunMusic Beta v1.0.{0}', github.run_number) || format('RunMusic v1.0.{0}', github.run_number) }}
          body: |
            RunMusic ${{ github.ref_name == 'beta' && 'Beta (AdMob Test Ads & Beta OTA updates)' || 'Production Release' }}
          files: android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}