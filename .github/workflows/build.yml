name: Build Android APK & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 🏗 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ☕ Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 💾 Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 📦 Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 🛠 Prebuild Android
        run: npx expo prebuild --platform android

      - name: 🔧 Force Old Architecture (disable New Architecture)
        run: |
          sed -i 's/newArchEnabled=true/newArchEnabled=false/' android/gradle.properties
          grep -q 'newArchEnabled' android/gradle.properties || echo 'newArchEnabled=false' >> android/gradle.properties
          echo "--- gradle.properties (newArch line) ---"
          grep newArch android/gradle.properties

      - name: 🏗 Build APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --build-cache -x lintVitalRelease

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RunMusic.apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: 🏷 Create Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: RunMusic v1.0.${{ github.run_number }}
          body: |
            runmusic
          files: android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}