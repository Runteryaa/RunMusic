name: Build & Release Windows Client

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Release Title (leave empty for default title)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Windows Installer
    runs-on: windows-latest

    steps:
      - name: 🏗 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 🔢 Resolve Version
        shell: pwsh
        run: |
          # Windows releases use the Windows workflow's run number:
          # version = 1.1.<run number>, tag = win-v1.1.<run number>.
          $build = [int](git rev-list --count HEAD)
          $version = "1.1.$($env:GITHUB_RUN_NUMBER)"
          node scripts/version.mjs apply $version --build $build
          node scripts/version.mjs check
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "BUILD=$build" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TAG=win-v$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Resolved release: win-v$version (commit build $build)"

      - name: 🦀 Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 🖥️ Setup MSVC Dev Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: 💾 Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            desktop/target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: 🏗 Build Windows Client (Release)
        working-directory: desktop
        run: cargo build --release

      - name: ⚙️ Setup Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: 📦 Compile Installer
        working-directory: desktop
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: 📝 Rename Assets with Version
        working-directory: desktop
        shell: pwsh
        run: |
          $version = $env:VERSION
          Copy-Item "installer_output\RunMusic-Remote-Setup.exe" "installer_output\RunMusic-Remote-Setup-$version.exe"
          Copy-Item "target\release\runmusic-win.exe" "target\release\runmusic-win-$version.exe"
          Get-ChildItem installer_output, target\release -Filter "*$version*" | Select-Object Name, Length

      - name: 🔐 Generate Checksums
        working-directory: desktop
        shell: pwsh
        run: |
          $version = $env:VERSION
          $files = @(
            "installer_output\RunMusic-Remote-Setup-$version.exe",
            "installer_output\RunMusic-Remote-Setup.exe",
            "target\release\runmusic-win-$version.exe",
            "target\release\runmusic-win.exe"
          )
          $lines = foreach ($file in $files) {
            $hash = Get-FileHash $file -Algorithm SHA256
            "$($hash.Hash)  $(Split-Path $file -Leaf)"
          }
          $lines | Out-File -FilePath installer_output\checksums.txt -Encoding utf8
          Get-Content installer_output\checksums.txt

      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RunMusic-Remote-Windows-${{ env.VERSION }}
          path: |
            desktop/installer_output/RunMusic-Remote-Setup-${{ env.VERSION }}.exe
            desktop/installer_output/RunMusic-Remote-Setup.exe
            desktop/target/release/runmusic-win-${{ env.VERSION }}.exe
            desktop/target/release/runmusic-win.exe
            desktop/installer_output/checksums.txt

      - name: 🏷 Create Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ inputs.release_name != '' && inputs.release_name || format('RunMusic Remote Windows v{0}', env.VERSION) }}
          body: |
            ## RunMusic Remote — Windows İstemcisi (v${{ env.VERSION }})

            Düşük kaynak tüketimli (BLE), canlı söz takibi ve dinamik kapak temalı Windows kumandası.

            ### İndirme Seçenekleri:
            - **`RunMusic-Remote-Setup-${{ env.VERSION }}.exe`** — Kurulum sihirbazı (Önerilen)
            - **`runmusic-win-${{ env.VERSION }}.exe`** — Taşınabilir (Portable / Standalone) tek dosya çalıştırılabilir sürüm

            Sabit bağlantılar için sürümsüz kopyalar (`RunMusic-Remote-Setup.exe`, `runmusic-win.exe`) da eklenmiştir.

            ### Özellikler:
            - 🚀 Ultra düşük RAM (~2-3 MB) ve minimal CPU kullanımı
            - 📱 Bluetooth Low Energy (BLE) ile RunMusic Android ana makinesine otomatik bağlanma
            - 🎵 Oynat / duraklat, önceki / sonraki parça ve arama (seek) kontrolleri
            - 🎤 Genişletilebilir canlı şarkı sözü paneli ve ofset senkronizasyonu
            - 🎨 Kapak resmine göre dinamik tema vurgu rengi
            - 📌 Diğer pencerelerin üzerinde tutma (Pin) ve Sistem Tepsisi (Tray) entegrasyonu
          files: |
            desktop/installer_output/RunMusic-Remote-Setup-${{ env.VERSION }}.exe
            desktop/installer_output/RunMusic-Remote-Setup.exe
            desktop/target/release/runmusic-win-${{ env.VERSION }}.exe
            desktop/target/release/runmusic-win.exe
            desktop/installer_output/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
