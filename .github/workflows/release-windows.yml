name: Build & Release Windows Client

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (leave empty for win-v1.0.<run_number>)'
        required: false
        default: ''
      release_name:
        description: 'Release Title (leave empty for default title)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Windows Installer
    runs-on: windows-latest

    steps:
      - name: 🏗 Checkout Repository
        uses: actions/checkout@v4

      - name: 🦀 Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 💾 Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            desktop/target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: 🏗 Build Windows Client (Release)
        working-directory: desktop
        run: cargo build --release

      - name: ⚙️ Setup Inno Setup
        uses: Min-Feng/setup-innosetup@v1

      - name: 📦 Compile Installer
        working-directory: desktop
        run: ISCC.exe installer.iss

      - name: 🔐 Generate Checksums
        working-directory: desktop
        shell: pwsh
        run: |
          $setupHash = Get-FileHash installer_output\RunMusic-Remote-Setup.exe -Algorithm SHA256
          $exeHash = Get-FileHash target\release\runmusic-win.exe -Algorithm SHA256
          "$($setupHash.Hash)  RunMusic-Remote-Setup.exe" | Out-File -FilePath installer_output\checksums.txt -Encoding utf8
          "$($exeHash.Hash)  runmusic-win.exe" | Out-File -FilePath installer_output\checksums.txt -Encoding utf8 -Append
          Get-Content installer_output\checksums.txt

      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RunMusic-Remote-Windows
          path: |
            desktop/installer_output/RunMusic-Remote-Setup.exe
            desktop/target/release/runmusic-win.exe
            desktop/installer_output/checksums.txt

      - name: 🏷 Create Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name != '' && inputs.tag_name || format('win-v1.0.{0}', github.run_number) }}
          name: ${{ inputs.release_name != '' && inputs.release_name || format('RunMusic Remote Windows v1.0.{0}', github.run_number) }}
          body: |
            ## RunMusic Remote — Windows İstemcisi

            Düşük kaynak tüketimli (BLE), canlı söz takibi ve dinamik kapak temalı Windows kumandası.

            ### İndirme Seçenekleri:
            - **`RunMusic-Remote-Setup.exe`** — Kurulum sihirbazı (Önerilen)
            - **`runmusic-win.exe`** — Taşınabilir (Portable / Standalone) tek dosya çalıştırılabilir sürüm

            ### Özellikler:
            - 🚀 Ultra düşük RAM (~2-3 MB) ve minimal CPU kullanımı
            - 📱 Bluetooth Low Energy (BLE) ile RunMusic Android ana makinesine otomatik bağlanma
            - 🎵 Oynat / duraklat, önceki / sonraki parça ve arama (seek) kontrolleri
            - 🎤 Genişletilebilir canlı şarkı sözü paneli ve ofset senkronizasyonu
            - 🎨 Kapak resmine göre dinamik tema vurgu rengi
            - 📌 Diğer pencerelerin üzerinde tutma (Pin) ve Sistem Tepsisi (Tray) entegrasyonu
          files: |
            desktop/installer_output/RunMusic-Remote-Setup.exe
            desktop/target/release/runmusic-win.exe
            desktop/installer_output/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
