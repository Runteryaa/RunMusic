name: Build iOS IPA & Attach to Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-15

    steps:
      - name: 🏗 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 🔢 Resolve Version
        run: |
          set -euo pipefail
          git fetch --tags --force || true
          LATEST_TAG=$(git tag -l 'v1.1.*' --sort=-v:refname | head -n 1 || true)
          if [ -n "$LATEST_TAG" ]; then
            VERSION="${LATEST_TAG#v}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          BUILD=$(git rev-list --count HEAD)
          node scripts/version.mjs apply "$VERSION" --build "$BUILD"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "BUILD=${BUILD}" >> "$GITHUB_ENV"
          echo "Building iOS ${VERSION} (build ${BUILD})"

      - name: ✅ Verify Version Consistency
        run: node scripts/version.mjs check

      - name: 📦 Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 🔍 Inspect Default Xcode & SDKs
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -showsdks

      - name: 🛠 Prebuild iOS
        run: |
          node ./scripts/patch-ble-plx.js
          node ./scripts/patch-swift-tools.js
          npx expo prebuild --platform ios
          node ./scripts/patch-swift-tools.js

      - name: 🏗 Compile Unsigned iOS Archive
        env:
          EXPO_PUBLIC_APP_VERSION: ${{ env.VERSION }}
        run: |
          cd ios
          xcodebuild clean archive \
            -workspace RunMusic.xcworkspace \
            -scheme RunMusic \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            -archivePath ./build/RunMusic.xcarchive
          cd ..

      - name: 📦 Package into .ipa
        run: |
          cd ios
          mkdir -p Payload
          cp -R ./build/RunMusic.xcarchive/Products/Applications/RunMusic.app ./Payload/
          zip -r -y ../RunMusic.ipa Payload
          rm -rf Payload
          cd ..
          ls -lh RunMusic.ipa

      - name: 🏷 Locate Release, Rename IPA & Attach
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "=== Locating release for commit ${GITHUB_SHA} ==="
          TARGET_TAG=""

          # Wait up to 5 minutes for the Android workflow to create the release for this commit.
          for i in {1..30}; do
            git fetch --tags --force 2>/dev/null || true

            COMMIT_TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]' | grep -v '^win-' | head -n 1 || true)
            if [ -n "$COMMIT_TAG" ]; then
              TARGET_TAG="$COMMIT_TAG"
              echo "✅ Found git tag pointing to current commit: $TARGET_TAG"
              break
            fi

            RELEASE_TAG=$(gh release list --limit 20 --json tagName,targetCommitish \
              -q ".[] | select(.targetCommitish == \"${GITHUB_SHA}\" and (.tagName | test(\"^v[0-9]\"))) | .tagName" | head -n 1 || true)
            if [ -n "$RELEASE_TAG" ]; then
              TARGET_TAG="$RELEASE_TAG"
              echo "✅ Found GitHub release matching commit SHA: $TARGET_TAG"
              break
            fi

            echo "⏳ Release not found yet. Waiting for Android workflow (attempt $i/30)..."
            sleep 10
          done

          if [ -z "$TARGET_TAG" ]; then
            echo "⚠️ No release matched this commit. Using the latest mobile release."
            TARGET_TAG=$(gh release list --limit 20 --json tagName \
              -q '[.[] | select(.tagName | test("^v[0-9]"))][0].tagName' || true)
          fi

          if [ -z "$TARGET_TAG" ]; then
            TARGET_TAG="v${VERSION}"
            echo "🚀 Creating brand new release $TARGET_TAG..."
            gh release create "$TARGET_TAG" --title "RunMusic $TARGET_TAG" --notes "RunMusic iOS Release"
          fi

          IPA_NAME="RunMusic-${TARGET_TAG#v}.ipa"
          mv RunMusic.ipa "$IPA_NAME"
          echo "IPA_NAME=${IPA_NAME}" >> "$GITHUB_ENV"
          echo "TARGET_TAG=${TARGET_TAG}" >> "$GITHUB_ENV"
          echo "🚀 Uploading $IPA_NAME to release: $TARGET_TAG..."
          gh release upload "$TARGET_TAG" "$IPA_NAME" --clobber
          echo "✅ Successfully uploaded $IPA_NAME to release $TARGET_TAG!"

      - name: 📤 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}
          path: ${{ env.IPA_NAME }}
