name: Build iOS IPA & Attach to Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-15

    steps:
      - name: 🏗 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 🔍 Inspect Default Xcode & SDKs
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -showsdks

      - name: 🛠 Prebuild iOS
        run: |
          node ./scripts/patch-ble-plx.js
          node ./scripts/patch-swift-tools.js
          npx expo prebuild --platform ios
          node ./scripts/patch-swift-tools.js

      - name: 🏗 Compile Unsigned iOS Archive
        run: |
          cd ios
          xcodebuild clean archive \
            -workspace RunMusic.xcworkspace \
            -scheme RunMusic \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            -archivePath ./build/RunMusic.xcarchive
          cd ..

      - name: 📦 Package into .ipa
        run: |
          cd ios
          mkdir -p Payload
          cp -R ./build/RunMusic.xcarchive/Products/Applications/RunMusic.app ./Payload/
          zip -r -y ../RunMusic.ipa Payload
          rm -rf Payload
          cd ..
          ls -lh RunMusic.ipa

      - name: 📤 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RunMusic.ipa
          path: RunMusic.ipa

      - name: 🏷 Attach IPA to Existing Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Locating release for commit ${GITHUB_SHA} ==="
          TARGET_TAG=""

          # Wait up to 5 minutes (30 x 10s) for Android build to finish and create release tag if running in parallel
          for i in {1..30}; do
            git fetch --tags --force 2>/dev/null || true
            
            # 1. Try finding tag pointing at current commit
            COMMIT_TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]' | head -n 1 || true)
            if [ -n "$COMMIT_TAG" ]; then
              TARGET_TAG="$COMMIT_TAG"
              echo "✅ Found git tag pointing to current commit: $TARGET_TAG"
              break
            fi

            # 2. Try finding release on GitHub matching current commit SHA
            RELEASE_TAG=$(gh release list --limit 10 --json tagName,targetCommitish -q ".[] | select(.targetCommitish == \"${GITHUB_SHA}\") | .tagName" | head -n 1 || true)
            if [ -n "$RELEASE_TAG" ]; then
              TARGET_TAG="$RELEASE_TAG"
              echo "✅ Found GitHub release matching commit SHA: $TARGET_TAG"
              break
            fi

            echo "⏳ Release not found yet. Waiting for Android workflow to finish creating release tag (attempt $i/30)..."
            sleep 10
          done

          # 3. Fallback: If still not found (e.g. manual workflow_dispatch), use the latest release
          if [ -z "$TARGET_TAG" ]; then
            echo "⚠️ Commit tag not detected. Searching for latest release on repo..."
            TARGET_TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName' || true)
          fi

          # 4. Fallback 2: If no releases exist at all, create a new one
          if [ -z "$TARGET_TAG" ]; then
            BRANCH_NAME="${GITHUB_REF_NAME}"
            if [ "$BRANCH_NAME" = "beta" ]; then
              TARGET_TAG="v1.0.${GITHUB_RUN_NUMBER}-beta"
            else
              TARGET_TAG="v1.0.${GITHUB_RUN_NUMBER}"
            fi
            echo "🚀 Creating brand new release $TARGET_TAG..."
            gh release create "$TARGET_TAG" RunMusic.ipa --title "RunMusic $TARGET_TAG" --notes "RunMusic iOS Release"
          else
            echo "🚀 Uploading RunMusic.ipa to release: $TARGET_TAG..."
            gh release upload "$TARGET_TAG" RunMusic.ipa --clobber
            echo "✅ Successfully uploaded RunMusic.ipa to release $TARGET_TAG!"
          fi
